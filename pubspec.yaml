name: stringlocale
description: Declare strings with typed params, compile to offline locale bundles with an LLM, and resolve by locale at runtime. Axis-model i18n for Dart and Flutter.
version: 0.3.0
repository: https://github.com/ssilwal29/stringlocale-flutter
homepage: https://github.com/ssilwal29/stringlocale-flutter
topics:
  - internationalization
  - localization
  - i18n
  - translation
  - flutter

executables:
  stringlocale:

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  http: ^1.0.0
  intl: ^0.20.2
  flutter:
    sdk: flutter

dev_dependencies:
  test: ^1.24.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
