<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stringlocale · translation dashboard</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a21;
    --panel-2: #1d212b;
    --border: #272b36;
    --text: #e4e7ec;
    --muted: #8b92a0;
    --accent: #6366f1;
    --accent-dim: #4f46e5;
    --green: #22c55e;
    --amber: #f59e0b;
    --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, monospace;
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
  }
  header {
    border-bottom: 1px solid var(--border); padding: 16px 24px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .logo {
    font-family: var(--mono); font-weight: 700; font-size: 13px;
    background: var(--accent); color: #fff; padding: 4px 10px; border-radius: 6px;
    letter-spacing: 0.03em;
  }
  .sub { color: var(--muted); font-size: 12px; }
  .toolbar {
    padding: 14px 24px; display: flex; gap: 12px; align-items: center;
    flex-wrap: wrap; border-bottom: 1px solid var(--border);
  }
  button, .filebtn {
    font-family: var(--sans); font-size: 13px; cursor: pointer;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 7px 14px; border-radius: 7px; transition: all 0.15s;
  }
  button:hover, .filebtn:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-dim); }
  input[type="file"] { display: none; }
  .search {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 7px 12px; border-radius: 7px; font-size: 13px; min-width: 200px;
    font-family: var(--sans);
  }
  .search:focus { outline: none; border-color: var(--accent); }
  .stats { color: var(--muted); font-size: 12px; margin-left: auto; }
  .wrap { padding: 0 24px 60px; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 1;
  }
  td {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .key {
    font-family: var(--mono); font-size: 12px; color: var(--accent);
    white-space: nowrap;
  }
  .source { color: var(--muted); font-size: 13px; max-width: 280px; }
  .cell {
    position: relative; min-width: 200px;
  }
  .cell textarea {
    width: 100%; background: var(--panel); color: var(--text);
    border: 1px solid transparent; border-radius: 6px; padding: 7px 9px;
    font-family: var(--sans); font-size: 13px; resize: vertical; min-height: 38px;
    line-height: 1.4; transition: border-color 0.15s;
  }
  .cell textarea:focus { outline: none; border-color: var(--accent); background: var(--panel-2); }
  .cell.overridden textarea { border-color: var(--amber); }
  .cell.plural { display: flex; flex-direction: column; gap: 5px; }
  .cell .plural-label {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    text-transform: uppercase; margin-bottom: -2px;
  }
  .badge {
    display: inline-block; font-family: var(--mono); font-size: 9px;
    padding: 2px 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle;
  }
  .badge.override { background: rgba(245,158,11,0.15); color: var(--amber); }
  .badge.plural { background: rgba(99,102,241,0.15); color: var(--accent); }
  .rule {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    margin-top: 3px;
  }
  .empty {
    padding: 60px 24px; text-align: center; color: var(--muted);
  }
  .empty h2 { color: var(--text); font-weight: 600; }
  .empty code {
    font-family: var(--mono); font-size: 12px; background: var(--panel-2);
    padding: 2px 7px; border-radius: 4px; color: var(--accent);
  }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .placeholder-warn {
    color: var(--amber); font-size: 11px; font-family: var(--mono); margin-top: 3px;
  }
</style>
</head>
<body>
<header>
  <span class="logo">stringlocale</span>
  <span class="sub">translation dashboard · browse &amp; override compiled locales</span>
</header>

<div class="toolbar">
  <label class="filebtn">
    Load locale JSON…
    <input type="file" id="fileInput" accept=".json" multiple>
  </label>
  <input type="text" class="search" id="search" placeholder="Filter keys…">
  <button class="primary" id="exportBtn">Export overrides</button>
  <button id="clearBtn">Clear all</button>
  <span class="stats" id="stats"></span>
</div>

<div class="wrap">
  <div id="content"></div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
// locales: { localeCode: { key: entry } }  — entry is {text,...} or {singular,plural,rule,...}
// overrides: { localeCode: { key: entry } } — user edits
const state = {
  locales: {},      // compiled data, keyed by locale code
  overrides: {},    // edits, keyed by locale code
  sourceKeys: [],   // ordered list of keys (from first loaded locale or 'en')
  sources: {},      // key -> source/english text for reference
};

const PLURAL_SEP = "|||";

// ── File loading ───────────────────────────────────────────────────────────

document.getElementById("fileInput").addEventListener("change", async (e) => {
  for (const file of e.target.files) {
    const code = file.name.replace(/\.json$/, "");
    const text = await file.text();
    try {
      const data = JSON.parse(text);
      state.locales[code] = data;
      if (!state.overrides[code]) state.overrides[code] = {};
    } catch (err) {
      alert(`Failed to parse ${file.name}: ${err.message}`);
    }
  }
  rebuildKeys();
  render();
});

function rebuildKeys() {
  // Collect all keys across all locales
  const keySet = new Set();
  for (const code of Object.keys(state.locales)) {
    for (const k of Object.keys(state.locales[code])) keySet.add(k);
  }
  state.sourceKeys = [...keySet];

  // Use English locale as source reference if present
  const en = state.locales["en"];
  for (const k of state.sourceKeys) {
    if (en && en[k]) {
      state.sources[k] = entryText(en[k]);
    } else {
      // Fall back to any locale's text just for reference column
      state.sources[k] = state.sources[k] || "";
    }
  }
}

function entryText(entry) {
  if (typeof entry === "string") return entry;
  if (entry.singular !== undefined) return entry.singular + " / " + entry.plural;
  return entry.text ?? "";
}

function isPlural(entry) {
  return entry && typeof entry === "object" && entry.singular !== undefined;
}

// ── Placeholder check ──────────────────────────────────────────────────────

function placeholders(s) {
  const set = new Set();
  const re = /\{(\w+)\}/g; let m;
  while ((m = re.exec(s || "")) !== null) set.add(m[1]);
  return set;
}

function placeholderMismatch(source, value) {
  const a = placeholders(source), b = placeholders(value);
  const missing = [...a].filter(x => !b.has(x));
  return missing.length ? missing : null;
}

// ── Rendering ──────────────────────────────────────────────────────────────

function render() {
  const content = document.getElementById("content");
  const codes = Object.keys(state.locales);

  if (codes.length === 0) {
    content.innerHTML = `
      <div class="empty">
        <h2>No locales loaded</h2>
        <p>Load your compiled locale files (e.g. <code>ne-NP.json</code>, <code>ja-JP.json</code>) to browse and edit translations.</p>
        <p class="hint">Edits are saved as overrides. Export them to <code>locales/overrides/&lt;code&gt;.json</code> — the compiler never touches override files, and they always win at runtime.</p>
      </div>`;
    document.getElementById("stats").textContent = "";
    return;
  }

  const filter = document.getElementById("search").value.toLowerCase();
  const keys = state.sourceKeys.filter(k => k.toLowerCase().includes(filter));

  let html = "<table><thead><tr>";
  html += "<th>Key</th><th>Source (en)</th>";
  for (const code of codes) html += `<th>${code}</th>`;
  html += "</tr></thead><tbody>";

  for (const key of keys) {
    html += "<tr>";
    html += `<td class="key">${key}</td>`;
    html += `<td class="source">${escapeHtml(state.sources[key] || "—")}</td>`;

    for (const code of codes) {
      html += renderCell(code, key);
    }
    html += "</tr>";
  }
  html += "</tbody></table>";
  content.innerHTML = html;

  // Stats
  let overrideCount = 0;
  for (const code of Object.keys(state.overrides))
    overrideCount += Object.keys(state.overrides[code]).length;
  document.getElementById("stats").textContent =
    `${keys.length} keys · ${codes.length} locales · ${overrideCount} overrides`;

  attachHandlers();
}

function renderCell(code, key) {
  const override = state.overrides[code]?.[key];
  const compiled = state.locales[code]?.[key];
  const entry = override ?? compiled;
  const hasOverride = override !== undefined;
  const source = state.sources[key] || "";

  if (!entry) {
    return `<td class="cell"><textarea data-code="${code}" data-key="${key}" data-field="text" placeholder="(missing)"></textarea></td>`;
  }

  if (isPlural(entry)) {
    const cls = hasOverride ? "cell plural overridden" : "cell plural";
    return `<td class="${cls}">
      <span class="badge plural">plural</span>${hasOverride ? '<span class="badge override">override</span>' : ''}
      <span class="plural-label">singular</span>
      <textarea data-code="${code}" data-key="${key}" data-field="singular">${escapeHtml(entry.singular)}</textarea>
      <span class="plural-label">plural</span>
      <textarea data-code="${code}" data-key="${key}" data-field="plural">${escapeHtml(entry.plural)}</textarea>
      <div class="rule">rule: ${escapeHtml(entry.rule || "")}</div>
    </td>`;
  }

  const text = typeof entry === "string" ? entry : (entry.text ?? "");
  const cls = hasOverride ? "cell overridden" : "cell";
  const mismatch = placeholderMismatch(source, text);
  const warn = mismatch ? `<div class="placeholder-warn">⚠ missing {${mismatch.join(", ")}}</div>` : "";
  const badge = hasOverride ? '<span class="badge override">override</span>' : '';

  return `<td class="${cls}">
    ${badge}
    <textarea data-code="${code}" data-key="${key}" data-field="text">${escapeHtml(text)}</textarea>
    ${warn}
  </td>`;
}

function attachHandlers() {
  document.querySelectorAll("textarea[data-key]").forEach(ta => {
    ta.addEventListener("input", onEdit);
    autoSize(ta);
  });
}

function autoSize(ta) {
  ta.style.height = "auto";
  ta.style.height = ta.scrollHeight + "px";
}

function onEdit(e) {
  const ta = e.target;
  const { code, key, field } = ta.dataset;
  const value = ta.value;
  autoSize(ta);

  if (!state.overrides[code]) state.overrides[code] = {};

  const compiled = state.locales[code]?.[key];

  if (field === "singular" || field === "plural") {
    // Build a full plural override entry
    const base = state.overrides[code][key] ?? (isPlural(compiled) ? { ...compiled } : { singular: "", plural: "", rule: "count < 2" });
    base[field] = value;
    state.overrides[code][key] = base;
  } else {
    state.overrides[code][key] = { text: value };
  }

  // Update visual override state without full re-render (keep focus)
  const cell = ta.closest(".cell");
  cell.classList.add("overridden");
  if (!cell.querySelector(".badge.override")) {
    const b = document.createElement("span");
    b.className = "badge override"; b.textContent = "override";
    cell.insertBefore(b, cell.firstChild);
  }
}

// ── Export ─────────────────────────────────────────────────────────────────

document.getElementById("exportBtn").addEventListener("click", () => {
  const codes = Object.keys(state.overrides).filter(c => Object.keys(state.overrides[c]).length);
  if (codes.length === 0) { alert("No overrides to export."); return; }

  for (const code of codes) {
    const blob = new Blob([JSON.stringify(state.overrides[code], null, 2) + "\n"], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${code}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }
  alert(`Exported ${codes.length} override file(s). Place them in locales/overrides/`);
});

document.getElementById("clearBtn").addEventListener("click", () => {
  if (!confirm("Clear all loaded locales and overrides?")) return;
  state.locales = {}; state.overrides = {}; state.sourceKeys = []; state.sources = {};
  render();
});

document.getElementById("search").addEventListener("input", render);

// ── Util ───────────────────────────────────────────────────────────────────

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

render();
</script>
</body>
</html>
